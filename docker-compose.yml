services:
  codearts2api:
    # 默认用 GHCR 预构建镜像；本地构建改为 build: . 并注释掉 image
    image: ghcr.io/ifsherlock/codearts2api:latest
    container_name: codearts2api
    restart: unless-stopped
    ports:
      - "7866:7866"
    environment:
      CA2A_API_KEY: ${CA2A_API_KEY:?需要设置 CA2A_API_KEY（写 .env 或 export 到环境变量）}
      TZ: Asia/Shanghai
    volumes:
      - ./auths:/app/auths
      - ./data:/app/data
      - ./config.json:/app/config.json:ro
